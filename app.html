<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Cockroach Live</title>
<style>
  :root { --bg:#100d09; --card:rgba(255,248,238,.06); --line:rgba(255,248,238,.12); --txt:#fff8ee; --mut:#b9ad9a;
          --gold:#e8b84a; --ok:#4ade80; --bad:#ef4444; --warn:#fbbf24; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; min-height:100%; background:radial-gradient(120% 60% at 50% 0%,#2a1d12 0%,var(--bg) 60%) fixed; color:var(--txt);
              font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:440px; margin:0 auto; padding:calc(18px + env(safe-area-inset-top)) 18px calc(120px + env(safe-area-inset-bottom)); display:grid; gap:14px; }
  header { display:flex; align-items:center; gap:12px; }
  .logo { width:46px; height:46px; border-radius:14px; display:grid; place-items:center; font-size:26px; background:linear-gradient(145deg,#f1c232,#b3202a); }
  h1 { margin:0; font:italic 400 26px/1.1 Georgia,serif; color:var(--gold); }
  header p { margin:2px 0 0; color:var(--mut); font-size:13px; }
  .chip-s { margin-left:auto; display:flex; align-items:center; gap:7px; padding:6px 12px; border-radius:999px; border:1px solid var(--line); background:var(--card); font-size:13px; font-weight:600; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--mut); }
  [data-s=on] .dot { background:var(--ok); animation:p 1.4s infinite; } [data-s=connecting] .dot { background:var(--warn); animation:p .8s infinite; } [data-s=error] .dot { background:var(--bad); }
  @keyframes p { 50% { opacity:.35; } } @media (prefers-reduced-motion:reduce) { .dot { animation:none !important; } }
  .card { border:1px solid var(--line); background:var(--card); border-radius:18px; padding:16px; display:grid; gap:12px; backdrop-filter:blur(8px); }
  .card h2 { margin:0; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--mut); font-weight:600; }
  label { display:grid; gap:6px; font-size:14px; color:var(--mut); }
  .in { display:flex; align-items:center; border:1px solid var(--line); border-radius:12px; background:rgba(0,0,0,.35); }
  .in:focus-within { border-color:var(--gold); }
  .in span { padding-left:12px; color:var(--mut); }
  input { flex:1; min-width:0; font:inherit; color:var(--txt); background:none; border:0; padding:13px 12px; outline:0; }
  .in button { border:0; background:none; color:var(--gold); font:inherit; font-size:13px; padding:0 14px; min-height:44px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { font:inherit; font-size:13px; color:var(--txt); border:1px solid var(--line); background:var(--card); border-radius:999px; padding:9px 14px; min-height:40px; }
  button:focus-visible { outline:3px solid var(--gold); outline-offset:2px; }
  #info { margin:0; font-size:14px; color:var(--mut); min-height:1.4em; }
  #bar { position:fixed; left:0; right:0; bottom:0; padding:14px 18px calc(14px + env(safe-area-inset-bottom)); background:linear-gradient(transparent,var(--bg) 40%); }
  #sw { display:block; width:100%; max-width:440px; margin:0 auto; min-height:56px; border:0; border-radius:16px; font:inherit; font-size:17px; font-weight:700;
        background:linear-gradient(145deg,#f1c232,#e8a020); color:#2a1b05; }
  #sw.on { background:linear-gradient(145deg,#ef4444,#b3202a); color:#fff; } #sw:disabled { opacity:.6; }
  #game { position:fixed; inset:0; width:100%; height:100%; border:0; background:#000; display:none; }
  #top { position:fixed; left:10px; right:10px; top:calc(10px + env(safe-area-inset-top)); display:none; justify-content:space-between; align-items:center; z-index:5; pointer-events:none; }
  #top > * { pointer-events:auto; }
  #live { display:flex; align-items:center; gap:7px; padding:7px 13px; border-radius:999px; background:rgba(0,0,0,.55); font-size:13px; font-weight:600; }
  #off { font:inherit; font-size:14px; font-weight:600; padding:0 16px; min-height:40px; border:0; border-radius:999px; background:rgba(179,32,42,.92); color:#fff; }
</style>
</head>
<body>
<main>
  <header>
    <div class="logo" aria-hidden="true">🪳</div>
    <div><h1>Cockroach Live</h1><p>Pesta kecoak interaktif untuk live TikTok</p></div>
    <div class="chip-s" id="chip" data-s="off"><i class="dot"></i><span id="cs">Mati</span></div>
  </header>

  <section class="card" aria-labelledby="h-srv">
    <h2 id="h-srv">Server</h2>
    <label>Alamat server
      <div class="in"><input id="server" inputmode="url" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="http://127.0.0.1:3000"></div>
    </label>
    <div class="chips" aria-label="Isi cepat">
      <button type="button" class="chip" data-fill="http://127.0.0.1:3000">Di HP ini (Termux)</button>
      <button type="button" class="chip" data-fill="https://">Railway</button>
    </div>
  </section>

  <section class="card" aria-labelledby="h-acc">
    <h2 id="h-acc">Akun TikTok</h2>
    <label>Username
      <div class="in"><span>@</span><input id="user" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="tanpa @"></div>
    </label>
    <label>Kunci server (opsional)
      <div class="in"><input id="key" type="password" autocapitalize="off" autocomplete="off"><button type="button" id="eye">Lihat</button></div>
    </label>
    <p id="info" role="status"></p>
  </section>
</main>

<div id="bar"><button id="sw">Nyalakan siaran</button></div>
<iframe id="game" title="Game pesta kecoak"></iframe>
<div id="top"><div id="live"><i class="dot" style="background:var(--ok)"></i><span id="who">LIVE</span></div><button id="off">■ Matikan</button></div>

<script>
const $ = id => document.getElementById(id), K = 'cl-settings';
const saved = JSON.parse(localStorage.getItem(K) || '{}');
['server', 'user', 'key'].forEach(k => $(k).value = saved[k] || '');
let on = false, lock = null, poll = null;
const base = () => { let s = $('server').value.trim().replace(/\/+$/, ''); if (s && !/^https?:\/\//.test(s)) s = 'http://' + s; return s; };
const say = t => $('info').textContent = t;
const LBL = { off: 'Mati', connecting: 'Menyambung', on: 'LIVE', error: 'Server putus' };
function setS(s) { $('chip').dataset.s = s; $('cs').textContent = LBL[s] || s; }

document.querySelectorAll('[data-fill]').forEach(b => b.onclick = () => { $('server').value = b.dataset.fill; $('server').focus(); });
$('eye').onclick = () => { const h = $('key').type === 'password'; $('key').type = h ? 'text' : 'password'; $('eye').textContent = h ? 'Sembunyi' : 'Lihat'; };

async function api(path, body) {
  const r = await fetch(base() + path, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-key': $('key').value }, body: JSON.stringify(body || {}) });
  if (r.status === 401) throw new Error('Kunci salah.');
  if (!r.ok) throw new Error('Server menolak (' + r.status + ').');
}
function view(v) {
  on = v; $('sw').classList.toggle('on', v); $('sw').textContent = v ? 'Matikan siaran' : 'Nyalakan siaran';
  $('game').style.display = v ? 'block' : 'none'; $('top').style.display = v ? 'flex' : 'none';
  $('bar').style.display = v ? 'none' : 'block'; $('game').src = v ? base() + '/' : 'about:blank';
  $('who').textContent = v ? 'LIVE @' + $('user').value.trim().replace('@', '') : 'LIVE';
  clearInterval(poll);
  if (v) poll = setInterval(async () => { try { const j = await (await fetch(base() + '/api/status')).json(); setS(j.state); } catch (e) { setS('error'); } }, 3000);
}
async function turnOn() {
  if (!base() || !$('user').value.trim()) return say('Isi alamat server dan username dulu.');
  localStorage.setItem(K, JSON.stringify({ server: $('server').value, user: $('user').value, key: $('key').value }));
  $('sw').disabled = true; setS('connecting'); say('Menghubungi server...');
  try {
    await api('/api/start', { user: $('user').value.trim().replace('@', '') });
    view(true); say('');
    try { lock = await navigator.wakeLock.request('screen'); } catch (e) {}
  } catch (e) { setS('error'); say(e.message === 'Failed to fetch' ? 'Server tidak bisa dihubungi. Cek alamat dan pastikan server sudah jalan.' : e.message); }
  $('sw').disabled = false;
}
async function turnOff() {
  try { await api('/api/stop'); say('Siaran dimatikan.'); } catch (e) { say('Tampilan ditutup, tapi server belum menjawab.'); }
  if (lock) { lock.release(); lock = null; }
  view(false); setS('off');
}
$('sw').onclick = () => on ? turnOff() : turnOn();
$('off').onclick = turnOff;
</script>
</body>
</html>
