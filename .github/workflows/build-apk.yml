name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Cek file proyek
        run: |
          ls -A
          for f in package.json capacitor.config.json www/index.html; do
            [ -f "$f" ] || { echo "::error::File $f tidak ada di repo"; exit 1; }
          done
          grep -q '@capacitor/cli' package.json || { echo "::error::package.json belum berisi @capacitor/cli (pakai package.json terbaru)"; exit 1; }
      - run: npm install --no-audit --no-fund
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../cockroach-live.apk
      - uses: actions/upload-artifact@v4
        with: { name: cockroach-live-apk, path: cockroach-live.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK build ${{ github.run_number }}
          files: cockroach-live.apk
